apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: payment
data:
  application.properties: |
    spring.application.name=payment-service

    # Custom config
    server.domain-name=localhost
    server.port=8080
    gateway.domain-name=localhost
    gateway.port=8080
    application.root-path=http://${server.domain-name}:${server.port}
    application.webhook-path=/api/v1/payments/webhooks
    application.webhook-url=${application.root-path}${application.webhook-path}
    application.payment-gateway=http://${gateway.domain-name}:${gateway.port}/mock/pay
    application.topic.payment=payment-events
    application.topic.order=order-events
    application.topic.inventory=inventory-events
    application.batch-size=10
    application.secret-key=truong123
    
    # postgres configuration
    spring.datasource.driver-class-name=org.postgresql.Driver
    spring.datasource.username=postgres

    # Spring JPA
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

    # Kafka server
    spring.kafka.bootstrap-servers=kafka-0.kafka-service.kafka.svc.cluster.local:9092

    # Kafka producer
    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

    # Kafka consumer
    spring.kafka.consumer.group-id=payment-group
    spring.kafka.consumer.auto-offset-reset=earliest
    spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
    spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
    spring.kafka.consumer.properties.spring.json.trusted.packages=*

    # Jackson
    spring.jackson.generator.write-bigdecimal-as-plain=true
    spring.jackson.deserialization.USE_BIG_DECIMAL_FOR_FLOATS=true
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payment
spec:
  selector:
    app: payment-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service-container
        image: antony2907/payment-service:1.0.1
        ports:
        - containerPort: 8080
        env:
        - name: TZ
          value: "Asia/Ho_Chi_Minh"
        - name: SERVER_DOMAIN_NAME
          value: payment-service.payment.svc.cluster.local
        - name: SERVER_PORT
          value: "8080"
        - name: GATEWAY_DOMAIN_NAME
          value: payment-simulator-nodeport.payment-simulator.svc.cluster.local
        - name: GATEWAY_PORT
          value: "8080"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-0.postgres-service.payment.svc.cluster.local:5432/payment_db
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payment-db-secret
              key: password
        volumeMounts:
        # Mount the ConfigMap as a file in /config
        - name: config-volume
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: payment-service-config
