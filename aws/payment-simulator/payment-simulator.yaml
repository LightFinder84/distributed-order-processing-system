apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-simulator-config
  namespace: payment-simulator
data:
  application.properties: |
    spring.application.name=payment-simulator-service

    # Custom config
    server.domain-name=localhost
    server.port=8080
    server.gateway.port=80
    server.url=http://${server.domain-name}:${server.gateway.port}/
    application.secret-key=truong123
    
    # ThymeLeaf
    spring.thymeleaf.prefix=classpath:/templates/
    spring.thymeleaf.suffix=.html
    spring.thymeleaf.cache=false
---
apiVersion: v1
kind: Service
metadata:
  name: payment-simulator-nodeport
  namespace: payment-simulator
  labels:
    app: payment-simulator
spec:
  type: NodePort
  selector:
    app: payment-simulator
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 32001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-simulator
  namespace: payment-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-simulator
  template:
    metadata:
      labels:
        app: payment-simulator
    spec:
      containers:
      - name: payment-simulator-container
        image: antony2907/payment-simulator:1.0.1
        ports:
        - containerPort: 8080
        env:
          - name: TZ
            value: "Asia/Ho_Chi_Minh"
          - name: SERVER_DOMAIN_NAME
            value: payment-simulator-load-balancer-419288927.ap-southeast-1.elb.amazonaws.com
          - name: SERVER_GATEWAY_PORT
            value: "80"
        volumeMounts:
        # Mount the ConfigMap as a file in /config
        - name: config-volume
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: payment-simulator-config
