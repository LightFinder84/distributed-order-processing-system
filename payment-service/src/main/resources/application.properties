spring.application.name=payment-service

# Custom configs
application.root-path=http://localhost:${server.port}
application.webhook-path=/api/v1/payments/webhooks
application.webhook-url=${application.root-path}${application.webhook-path}
application.payment-gateway=http://localhost:8083/mock/pay
application.topic.payment=payment-events
application.topic.order=order-events
application.topic.inventory=inventory-events
application.batch-size=10
application.secret-key=truong123

# webserver
server.port = 8082

# Postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka consumer
spring.kafka.bootstrap-servers=192.168.56.124:9092

spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Jackson
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jackson.deserialization.USE_BIG_DECIMAL_FOR_FLOATS=true

